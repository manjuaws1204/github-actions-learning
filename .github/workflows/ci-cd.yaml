name: CI/CD - order-service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: order-service
  NAMESPACE: github-actions

jobs:
  # ---------------------------------------------------------------------
  # 1. TEST - runs on a normal GitHub-hosted runner, no cluster needed.
  # ---------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -v

  # ---------------------------------------------------------------------
  # 2. BUILD - must run on a SELF-HOSTED runner sitting on the same
  #    machine as minikube, because it builds the image straight into
  #    minikube's internal image store (no external registry needed
  #    for this local learning setup).
  # ---------------------------------------------------------------------
  build:
    needs: test
    runs-on: [self-hosted, minikube]
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose environment
        # Temporary diagnostic step: confirms which user/profile context
        # the runner is actually operating under, to compare against a
        # manual terminal session.
        run: |
          whoami
          echo "USERPROFILE=$env:USERPROFILE"
          minikube profile list
          kubectl config current-context

      - name: Point Docker CLI at minikube's internal daemon, then build
        # `minikube image build` has known flakiness in non-interactive
        # sessions on Windows (it can exit fast with no output). This uses
        # the older, much more battle-tested approach instead: point the
        # regular `docker` CLI at minikube's own Docker daemon (the same
        # thing `eval $(minikube docker-env)` does on Linux/macOS) and
        # build with plain `docker build`. Both commands run in the SAME
        # step/process, since the env vars docker-env sets only last for
        # the process that set them.
        run: |
          & minikube.exe -p minikube docker-env --shell powershell | Invoke-Expression
          if ($LASTEXITCODE -ne 0) {
            Write-Error "minikube docker-env failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} ./app
          if ($LASTEXITCODE -ne 0) {
            Write-Error "docker build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

  # ---------------------------------------------------------------------
  # 3. DEPLOY - also self-hosted, applies manifests and rolls out the
  #    new image, then waits for the rollout to actually succeed.
  # ---------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: [self-hosted, minikube]
    steps:
      - uses: actions/checkout@v4

      - name: Apply namespace, Prometheus and RBAC (idempotent)
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/prometheus-rbac.yaml
          kubectl apply -f k8s/prometheus-configmap.yaml
          kubectl apply -f k8s/prometheus-deployment.yaml

      - name: Set image tag and deploy order-service
        # PowerShell's -replace instead of sed, since sed isn't available
        # on Windows by default.
        run: |
          (Get-Content k8s/deployment.yaml) -replace 'IMAGE_PLACEHOLDER', '${{ env.IMAGE_NAME }}:${{ github.sha }}' | kubectl apply -f -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl apply -f k8s/service.yaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Wait for rollout to finish
        run: |
          kubectl rollout status deployment/order-service -n ${{ env.NAMESPACE }} --timeout=120s

      - name: Show running pods
        if: always()
        run: kubectl get pods -n ${{ env.NAMESPACE }} -o wide